[project]
name = "airbnb-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Seowoo Jang (jinwoo)",email = "jjangsw0603@gmail.com"}
]
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "django (>=5.2,<6.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "strawberry-graphql[debug-server] (>=0.335.0,<0.336.0)",
    "strawberry-graphql-django (>=0.93.0,<0.94.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "django-environ (>=0.14.0,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]
